<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password — EastWest Portal</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    *{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'Inter',sans-serif;min-height:100vh;background:linear-gradient(135deg,#0f172a,#1e1b4b);display:flex;align-items:center;justify-content:center;padding:40px 20px;}
    .card{background:#fff;border-radius:20px;box-shadow:0 32px 80px rgba(0,0,0,.35);max-width:440px;width:100%;padding:40px;}
    .icon-wrap{width:64px;height:64px;background:#eff6ff;border-radius:14px;display:flex;align-items:center;justify-content:center;margin:0 auto 20px;}
    h1{font-size:1.5rem;font-weight:800;color:#0f172a;text-align:center;margin-bottom:8px;}
    p{color:#64748b;text-align:center;font-size:.88rem;margin-bottom:28px;}
    label{display:block;font-size:.8rem;font-weight:600;color:#374151;margin-bottom:6px;}
    .input-wrap{position:relative;margin-bottom:20px;}
    .input-wrap i{position:absolute;left:13px;top:50%;transform:translateY(-50%);color:#94a3b8;font-size:.82rem;}
    input{width:100%;padding:12px 12px 12px 38px;border:1.5px solid #e2e8f0;border-radius:9px;font-size:.9rem;font-family:'Inter',sans-serif;outline:none;transition:border-color .2s;}
    input:focus{border-color:#4f46e5;box-shadow:0 0 0 3px rgba(79,70,229,.12);}
    .btn{width:100%;padding:13px;background:linear-gradient(135deg,#4f46e5,#7c3aed);color:#fff;border:none;border-radius:10px;font-size:.95rem;font-weight:700;cursor:pointer;}
    .back{text-align:center;margin-top:18px;font-size:.82rem;color:#64748b;}
    .back a{color:#4f46e5;text-decoration:none;font-weight:600;}
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap"><i class="fas fa-key" style="color:#4f46e5;font-size:1.5rem;"></i></div>
    <h1>Reset Your Password</h1>
    <p>Enter your @ewubd.edu email and we'll send you a reset link.</p>
    <form method="post">
      {% csrf_token %}
      <label>Email Address</label>
      <div class="input-wrap">
        <i class="fas fa-envelope"></i>
        <input type="email" name="email" placeholder="you@ewubd.edu" required>
      </div>
      <button type="submit" class="btn">Send Reset Link</button>
    </form>
    <div class="back"><a href="{% url 'account_login' %}">← Back to Sign In</a></div>
  </div>
</body>
</html>
