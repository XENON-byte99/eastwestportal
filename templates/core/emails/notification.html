<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ title }}</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f4f7fa; }
        .container { max-width: 600px; margin: 20px auto; background: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .header { background: linear-gradient(135deg, #4f46e5, #7c3aed); padding: 30px; text-align: center; color: #ffffff; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 700; letter-spacing: -0.5px; }
        .content { padding: 40px; }
        .content h2 { margin-top: 0; color: #111; font-size: 20px; }
        .content p { margin-bottom: 25px; font-size: 16px; color: #555; }
        .button { display: inline-block; padding: 12px 24px; background-color: #4f46e5; color: #ffffff !important; text-decoration: none; border-radius: 8px; font-weight: 600; font-size: 15px; transition: opacity 0.2s; }
        .footer { padding: 20px; text-align: center; font-size: 12px; color: #999; border-top: 1px solid #eee; }
        .badge { display: inline-block; padding: 4px 10px; background: #eef2ff; color: #4f46e5; border-radius: 20px; font-size: 12px; font-weight: 700; text-transform: uppercase; margin-bottom: 15px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>EastWest Portal</h1>
        </div>
        <div class="content">
            <div class="badge">{{ category|default:"Notification" }}</div>
            <h2>{{ title }}</h2>
            <p>{{ message }}</p>
            {% if link %}
            <a href="{{ site_url }}{{ link }}" class="button">View on Portal</a>
            {% endif %}
        </div>
        <div class="footer">
            <p>&copy; {{ year }} EastWest University Portal. All rights reserved.</p>
            <p>This is an automated notification. Please do not reply directly to this email.</p>
        </div>
    </div>
</body>
</html>
