<!doctype html>
<html lang="en" class="h-full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Materials Panel</title>
    <script src="https://cdn.tailwindcss.com/3.4.17"></script>
    <script src="https://cdn.jsdelivr.net/npm/lucide@0.263.0/dist/umd/lucide.min.js"></script>
    <script src="/_sdk/element_sdk.js"></script>
    <script src="/_sdk/data_sdk.js"></script>
    <link
        href="https://fonts.googleapis.com/css2?family=Source+Serif+Pro:wght@400;600;700&amp;family=Inter:wght@400;500;600&amp;display=swap"
        rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            height: 100%;
            margin: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
        }

        .tree-node {
            padding: 8px 12px;
            margin: 2px 0;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
            user-select: none;
        }

        .tree-node:hover {
            opacity: 0.8;
        }

        .tree-node.active {
            font-weight: 600;
        }

        .tree-node-children {
            overflow: hidden;
            transition: max-height 0.25s ease;
        }

        .tree-node-children.collapsed {
            max-height: 0;
        }

        .tab-button {
            padding: 10px 14px;
            border-radius: 8px;
            border: 1px solid transparent;
            transition: all 0.2s ease;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .tab-button:hover {
            opacity: 0.8;
        }

        .tab-button.active {
            font-weight: 600;
        }

        .tab-content {
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .material-card {
            border-radius: 12px;
            padding: 16px;
            border: 1px solid;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .material-card:hover {
            transform: translateY(-2px);
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: overlayFadeIn 0.3s ease;
        }

        @keyframes overlayFadeIn {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }

        .modal {
            background: white;
            border-radius: 16px;
            max-width: 90%;
            max-height: 90%;
            width: 800px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 20px;
            border-bottom: 1px solid #e5e7eb;
        }

        .modal-body {
            flex: 1;
            overflow: auto;
            padding: 20px;
        }

        .modal-close {
            background: none;
            border: none;
            cursor: pointer;
            padding: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
    </style>
    <style>
        body {
            box-sizing: border-box;
        }
    </style>
</head>

<body class="h-full overflow-auto" style="background-color: #f9fafb;">
    <div id="app-wrapper" class="h-full w-full overflow-auto" style="background-color: #f9fafb;">
        <!-- Header -->
        <header class="sticky top-0 z-50 backdrop-blur-lg border-b"
            style="background: rgba(249,250,251,0.9); border-color: #e5e7eb;">
            <div class="max-w-7xl mx-auto px-6 py-4 flex items-center gap-3">
                <div class="w-10 h-10 rounded-lg flex items-center justify-center" style="background: #3b82f6;">
                    <i data-lucide="book-open" style="width:20px;height:20px;color:#fff;"></i>
                </div>
                <h1 id="panel-title" class="text-2xl font-bold"
                    style="font-family:'Source Serif Pro',serif; color:#1f2937;">Academic Materials</h1>
            </div>
        </header><!-- Main Layout -->
        <div class="max-w-7xl mx-auto px-6 py-6 flex gap-6" style="min-height: calc(100% - 70px);">
            <!-- Left Sidebar: Course & Faculty Tree -->
            <aside class="w-64 shrink-0">
                <div class="rounded-xl p-5 border sticky top-24" style="background: #fff; border-color: #e5e7eb;">
                    <h2 class="text-sm font-bold mb-4" style="color: #1f2937;">Courses</h2>
                    <div id="tree-container" class="space-y-1 text-sm"></div>
                </div>
            </aside><!-- Main Content -->
            <main class="flex-1 min-w-0">
                <!-- Tab Bar -->
                <div class="rounded-xl p-4 mb-6 border overflow-x-auto"
                    style="background: #fff; border-color: #e5e7eb;">
                    <div id="tab-bar" class="flex gap-2 min-w-min"></div>
                </div><!-- Content Area -->
                <div id="content-area" class="tab-content">
                    <div id="empty-state" class="text-center py-20">
                        <div class="w-16 h-16 mx-auto mb-4 rounded-xl flex items-center justify-center"
                            style="background: #f3f4f6;">
                            <i data-lucide="inbox" style="width:32px;height:32px;color:#9ca3af;"></i>
                        </div>
                        <p class="text-sm" style="color: #6b7280;" id="empty-message">Select a course to view materials
                        </p>
                    </div>
                    <div id="materials-grid" class="hidden grid gap-4"></div>
                </div>
            </main>
        </div>
    </div><!-- Modal for viewing PDFs/Videos -->
    <div id="modal-overlay" class="hidden modal-overlay">
        <div class="modal">
            <div class="modal-header">
                <h3 id="modal-title" style="color: #1f2937; font-weight: 600;"></h3><button id="modal-close"
                    class="modal-close" style="color: #6b7280;"> <i data-lucide="x" style="width:20px;height:20px;"></i>
                </button>
            </div>
            <div class="modal-body">
                <div id="modal-content"></div>
            </div>
        </div>
    </div>
    <script>
        // ── State ──
        let allMaterials = [];
        let selectedCourse = null;
        let selectedFaculty = null;
        let materialTypes = new Set();

        const defaultConfig = {
            panel_title: 'Academic Materials',
            no_content_message: 'No materials available',
            background_color: '#f9fafb',
            surface_color: '#ffffff',
            text_color: '#1f2937',
            primary_color: '#3b82f6',
            secondary_color: '#6b7280',
            font_family: 'Inter',
            font_size: 14
        };

        // ── Element SDK ──
        window.elementSdk.init({
            defaultConfig,
            onConfigChange: async (config) => {
                const bg = config.background_color || defaultConfig.background_color;
                const surface = config.surface_color || defaultConfig.surface_color;
                const text = config.text_color || defaultConfig.text_color;
                const primary = config.primary_color || defaultConfig.primary_color;
                document.body.style.backgroundColor = bg;
                document.getElementById('app-wrapper').style.backgroundColor = bg;
                document.getElementById('panel-title').textContent = config.panel_title || defaultConfig.panel_title;
                document.getElementById('panel-title').style.color = text;
                document.body.style.fontFamily = `${config.font_family || defaultConfig.font_family}, sans-serif`;
                document.body.style.fontSize = `${config.font_size || defaultConfig.font_size}px`;
                renderTree();
                renderTabs();
            },
            mapToCapabilities: (config) => ({
                recolorables: [
                    { get: () => config.background_color || defaultConfig.background_color, set: (v) => { config.background_color = v; window.elementSdk.setConfig({ background_color: v }); } },
                    { get: () => config.surface_color || defaultConfig.surface_color, set: (v) => { config.surface_color = v; window.elementSdk.setConfig({ surface_color: v }); } },
                    { get: () => config.text_color || defaultConfig.text_color, set: (v) => { config.text_color = v; window.elementSdk.setConfig({ text_color: v }); } },
                    { get: () => config.primary_color || defaultConfig.primary_color, set: (v) => { config.primary_color = v; window.elementSdk.setConfig({ primary_color: v }); } },
                    { get: () => config.secondary_color || defaultConfig.secondary_color, set: (v) => { config.secondary_color = v; window.elementSdk.setConfig({ secondary_color: v }); } }
                ],
                borderables: [],
                fontEditable: { get: () => config.font_family || defaultConfig.font_family, set: (v) => { config.font_family = v; window.elementSdk.setConfig({ font_family: v }); } },
                fontSizeable: { get: () => config.font_size || defaultConfig.font_size, set: (v) => { config.font_size = v; window.elementSdk.setConfig({ font_size: v }); } }
            }),
            mapToEditPanelValues: (config) => new Map([
                ['panel_title', config.panel_title || defaultConfig.panel_title],
                ['no_content_message', config.no_content_message || defaultConfig.no_content_message]
            ])
        });

        // ── Data SDK ──
        const dataHandler = {
            onDataChanged(data) {
                allMaterials = data || [];
                materialTypes = new Set(allMaterials.map(m => m.material_type));
                renderTree();
                renderTabs();
                renderContent();
            }
        };

        (async () => {
            const res = await window.dataSdk.init(dataHandler);
            if (!res.isOk) console.error('Data SDK init failed');

            // Prepopulate with sample data
            const sampleData = [
                { course_name: 'Advanced Calculus', faculty_name: 'Dr. Sarah Chen', material_type: 'PDF', title: 'Lecture Notes - Chapter 5: Integration', url: 'https://example.com/calc-ch5.pdf', description: 'Comprehensive guide to integral calculus fundamentals', order: 1 },
                { course_name: 'Advanced Calculus', faculty_name: 'Dr. Sarah Chen', material_type: 'PDF', title: 'Problem Set 3 Solutions', url: 'https://example.com/calc-ps3.pdf', description: 'Worked solutions for problem set 3', order: 2 },
                { course_name: 'Advanced Calculus', faculty_name: 'Dr. Sarah Chen', material_type: 'Video', title: 'Integration Techniques - Part 1', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', description: 'Video lecture on substitution and integration by parts', order: 1 },
                { course_name: 'Advanced Calculus', faculty_name: 'Dr. Sarah Chen', material_type: 'Video', title: 'Integration Techniques - Part 2', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', description: 'Advanced integration techniques and applications', order: 2 },
                { course_name: 'Advanced Calculus', faculty_name: 'Dr. Sarah Chen', material_type: 'Slides', title: 'Calculus Review Presentation', url: 'https://docs.google.com/presentation/d/example', description: 'Interactive slides covering key concepts', order: 1 },
                { course_name: 'Advanced Calculus', faculty_name: 'Dr. Sarah Chen', material_type: 'Project', title: 'Numerical Integration Project', url: 'https://example.com/project-numerical.zip', description: 'Implement Simpson\'s rule and compare with analytical solutions', order: 1 },
                { course_name: 'Advanced Calculus', faculty_name: 'Prof. Michael Torres', material_type: 'PDF', title: 'Multivariable Calculus Basics', url: 'https://example.com/multicalc-intro.pdf', description: 'Introduction to partial derivatives and gradients', order: 1 },
                { course_name: 'Advanced Calculus', faculty_name: 'Prof. Michael Torres', material_type: 'Quiz', title: 'Chapter 2 Quiz', url: 'https://example.com/quiz-ch2.pdf', description: 'Self-assessment quiz with answer key', order: 1 },
                { course_name: 'Advanced Calculus', faculty_name: 'Prof. Michael Torres', material_type: 'Video', title: 'Partial Derivatives Explained', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', description: 'Clear explanation with real-world examples', order: 1 },
                { course_name: 'Data Science 101', faculty_name: 'Dr. Priya Patel', material_type: 'PDF', title: 'Statistics Fundamentals', url: 'https://example.com/stats-101.pdf', description: 'Essential statistics concepts for data analysis', order: 1 },
                { course_name: 'Data Science 101', faculty_name: 'Dr. Priya Patel', material_type: 'Video', title: 'Python for Data Analysis', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', description: 'Hands-on tutorial with pandas and numpy', order: 1 },
                { course_name: 'Data Science 101', faculty_name: 'Dr. Priya Patel', material_type: 'Project', title: 'Iris Dataset Analysis', url: 'https://example.com/project-iris.ipynb', description: 'Complete analysis workflow with visualizations', order: 1 },
                { course_name: 'Data Science 101', faculty_name: 'Dr. Priya Patel', material_type: 'Link', title: 'Kaggle Competitions', url: 'https://www.kaggle.com', description: 'Access to real-world datasets and competitions', order: 1 },
                { course_name: 'Data Science 101', faculty_name: 'Prof. James Liu', material_type: 'PDF', title: 'Machine Learning Overview', url: 'https://example.com/ml-overview.pdf', description: 'Survey of supervised and unsupervised learning', order: 1 },
                { course_name: 'Data Science 101', faculty_name: 'Prof. James Liu', material_type: 'Slides', title: 'Deep Learning Basics', url: 'https://docs.google.com/presentation/d/example-ml', description: 'Neural networks and modern architectures', order: 1 },
                { course_name: 'Data Science 101', faculty_name: 'Prof. James Liu', material_type: 'Audio', title: 'Podcast: AI in Industry', url: 'https://example.com/podcast-ai.mp3', description: 'Industry experts discuss practical AI applications', order: 1 },
                { course_name: 'Organic Chemistry', faculty_name: 'Dr. Emma Johnson', material_type: 'PDF', title: 'Reaction Mechanisms Guide', url: 'https://example.com/reactions.pdf', description: 'Step-by-step mechanism drawings and explanations', order: 1 },
                { course_name: 'Organic Chemistry', faculty_name: 'Dr. Emma Johnson', material_type: 'PDF', title: 'Functional Groups Reference', url: 'https://example.com/functional-groups.pdf', description: 'Quick reference chart of common functional groups', order: 2 },
                { course_name: 'Organic Chemistry', faculty_name: 'Dr. Emma Johnson', material_type: 'Video', title: 'SN1 vs SN2 Reactions', url: 'https://www.youtube.com/embed/dQw4w9WgXcQ', description: 'Visual comparison of nucleophilic substitution mechanisms', order: 1 },
                { course_name: 'Organic Chemistry', faculty_name: 'Dr. Emma Johnson', material_type: 'Quiz', title: 'Mechanism Practice Problems', url: 'https://example.com/quiz-mechanisms.pdf', description: 'Challenge problems with detailed solutions', order: 1 },
                { course_name: 'Organic Chemistry', faculty_name: 'Prof. Robert Anderson', material_type: 'Slides', title: 'Synthesis Strategy Workshop', url: 'https://docs.google.com/presentation/d/example-org', description: 'Retrosynthetic analysis techniques', order: 1 },
                { course_name: 'Organic Chemistry', faculty_name: 'Prof. Robert Anderson', material_type: 'Project', title: 'Multi-step Synthesis Design', url: 'https://example.com/project-synthesis.pdf', description: 'Design 5-step synthesis pathways', order: 1 }
            ];

            // Check if data already exists to avoid duplicates
            const existingCount = allMaterials.length;
            if (existingCount === 0) {
                for (const item of sampleData) {
                    await window.dataSdk.create(item);
                }
            }
        })();

        function getConfig() {
            const c = window.elementSdk.config || {};
            return {
                bg: c.background_color || defaultConfig.background_color,
                surface: c.surface_color || defaultConfig.surface_color,
                text: c.text_color || defaultConfig.text_color,
                primary: c.primary_color || defaultConfig.primary_color,
                secondary: c.secondary_color || defaultConfig.secondary_color
            };
        }

        // ── Tree Rendering ──
        function renderTree() {
            const container = document.getElementById('tree-container');
            container.innerHTML = '';
            const colors = getConfig();

            // Group materials by course
            const courseMap = {};
            allMaterials.forEach(m => {
                if (!courseMap[m.course_name]) courseMap[m.course_name] = new Set();
                courseMap[m.course_name].add(m.faculty_name);
            });

            Object.keys(courseMap).sort().forEach(course => {
                const courseDiv = document.createElement('div');
                courseDiv.className = 'tree-node';
                courseDiv.style.cssText = `background: ${colors.primary}15; color: ${colors.primary}; cursor: pointer;`;
                courseDiv.innerHTML = `<span style="display:flex;align-items:center;gap:6px;"><i data-lucide="folder" style="width:14px;height:14px;"></i>${escapeHtml(course)}</span>`;

                const facultyContainer = document.createElement('div');
                facultyContainer.className = 'tree-node-children';
                facultyContainer.style.marginLeft = '12px';
                facultyContainer.style.marginTop = '4px';

                const facultyList = Array.from(courseMap[course]).sort();
                facultyList.forEach(faculty => {
                    const facultyDiv = document.createElement('div');
                    facultyDiv.className = 'tree-node';
                    facultyDiv.style.cssText = `background: ${selectedCourse === course && selectedFaculty === faculty ? colors.primary : 'transparent'}; color: ${selectedCourse === course && selectedFaculty === faculty ? '#fff' : colors.secondary}; padding-left: 20px;`;
                    facultyDiv.innerHTML = `<span style="display:flex;align-items:center;gap:6px;"><i data-lucide="user" style="width:12px;height:12px;"></i>${escapeHtml(faculty)}</span>`;
                    facultyDiv.addEventListener('click', () => selectCourseAndFaculty(course, faculty));
                    facultyContainer.appendChild(facultyDiv);
                });

                courseDiv.addEventListener('click', () => {
                    facultyContainer.classList.toggle('collapsed');
                });

                container.appendChild(courseDiv);
                container.appendChild(facultyContainer);
            });

            lucide.createIcons();
        }

        function selectCourseAndFaculty(course, faculty) {
            selectedCourse = course;
            selectedFaculty = faculty;
            renderTree();
            renderTabs();
            renderContent();
        }

        // ── Tab Rendering ──
        function renderTabs() {
            const tabBar = document.getElementById('tab-bar');
            tabBar.innerHTML = '';
            const colors = getConfig();

            if (!selectedCourse || !selectedFaculty) {
                document.getElementById('empty-state').classList.remove('hidden');
                document.getElementById('materials-grid').classList.add('hidden');
                return;
            }

            const filtered = allMaterials.filter(m => m.course_name === selectedCourse && m.faculty_name === selectedFaculty);
            const types = Array.from(new Set(filtered.map(m => m.material_type))).sort();

            types.forEach((type, idx) => {
                const count = filtered.filter(m => m.material_type === type).length;
                const btn = document.createElement('button');
                btn.className = 'tab-button active';
                btn.style.cssText = `background: ${colors.primary}; color: #fff; border-color: ${colors.primary};`;
                if (idx > 0) btn.classList.remove('active');
                btn.innerHTML = `<i data-lucide="file" style="width:14px;height:14px;"></i><span>${type}</span><span class="badge" style="background: rgba(255,255,255,0.3); color: #fff;">${count}</span>`;
                btn.addEventListener('click', () => {
                    tabBar.querySelectorAll('.tab-button').forEach(b => {
                        b.classList.remove('active');
                        b.style.background = 'transparent';
                        b.style.color = colors.secondary;
                        b.style.borderColor = '#e5e7eb';
                    });
                    btn.classList.add('active');
                    btn.style.background = colors.primary;
                    btn.style.color = '#fff';
                    btn.style.borderColor = colors.primary;
                    renderContent(type);
                });
                tabBar.appendChild(btn);
            });

            lucide.createIcons();

            if (types.length > 0) renderContent(types[0]);
        }

        // ── Content Rendering ──
        function renderContent(type) {
            if (!selectedCourse || !selectedFaculty) return;

            const colors = getConfig();
            const filtered = allMaterials.filter(m =>
                m.course_name === selectedCourse &&
                m.faculty_name === selectedFaculty &&
                m.material_type === type
            );

            const emptyState = document.getElementById('empty-state');
            const grid = document.getElementById('materials-grid');

            if (filtered.length === 0) {
                emptyState.classList.remove('hidden');
                grid.classList.add('hidden');
                document.getElementById('empty-message').textContent = window.elementSdk.config?.no_content_message || defaultConfig.no_content_message;
                return;
            }

            emptyState.classList.add('hidden');
            grid.classList.remove('hidden');
            grid.innerHTML = '';

            filtered.forEach(material => {
                const card = document.createElement('div');
                card.className = 'material-card';
                card.style.cssText = `background: ${colors.surface}; border-color: #e5e7eb; color: ${colors.text};`;
                card.innerHTML = `
          <div style="display:flex;align-items:flex-start;gap:12px;">
            <div style="flex-shrink:0;width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;background:${colors.primary}15;">
              <i data-lucide="${getIconForType(material.material_type)}" style="width:20px;height:20px;color:${colors.primary};"></i>
            </div>
            <div style="flex:1;">
              <h3 style="font-weight:600;margin:0;margin-bottom:4px;">${escapeHtml(material.title)}</h3>
              <p style="font-size:13px;color:${colors.secondary};margin:0;margin-bottom:8px;">${escapeHtml(material.description || 'No description')}</p>
              <button style="padding:6px 12px;border-radius:6px;background:${colors.primary};color:#fff;border:none;cursor:pointer;font-size:12px;font-weight:500;" data-url="${escapeHtml(material.url)}">View</button>
            </div>
          </div>
        `;
                card.querySelector('button').addEventListener('click', (e) => openViewer(material));
                grid.appendChild(card);
            });

            lucide.createIcons();
        }

        function getIconForType(type) {
            const map = {
                'PDF': 'file-pdf',
                'Video': 'play-circle',
                'Project': 'folder-open',
                'Quiz': 'clipboard-check',
                'Slides': 'presentation',
                'Audio': 'music',
                'Link': 'link'
            };
            return map[type] || 'file';
        }

        // ── Modal Viewer ──
        function openViewer(material) {
            const modal = document.getElementById('modal-overlay');
            const title = document.getElementById('modal-title');
            const content = document.getElementById('modal-content');

            title.textContent = material.title;
            content.innerHTML = '';

            const url = material.url;
            const type = material.material_type.toLowerCase();

            if (type === 'pdf') {
                const iframe = document.createElement('iframe');
                iframe.src = url;
                iframe.style.cssText = 'width:100%;height:600px;border:none;border-radius:8px;';
                content.appendChild(iframe);
            } else if (type === 'video') {
                const video = document.createElement('video');
                video.src = url;
                video.controls = true;
                video.style.cssText = 'width:100%;height:auto;border-radius:8px;';
                content.appendChild(video);
            } else if (type === 'slides') {
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.innerHTML = '<button style="padding:12px 24px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;">Open Presentation</button>';
                content.appendChild(link);
            } else if (type === 'audio') {
                const audio = document.createElement('audio');
                audio.src = url;
                audio.controls = true;
                audio.style.cssText = 'width:100%;';
                content.appendChild(audio);
            } else if (type === 'link') {
                const link = document.createElement('a');
                link.href = url;
                link.target = '_blank';
                link.rel = 'noopener noreferrer';
                link.innerHTML = `<button style="padding:12px 24px;background:#3b82f6;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px;font-weight:500;">Open Link</button>`;
                content.appendChild(link);
                const urlText = document.createElement('p');
                urlText.textContent = 'URL: ' + url;
                urlText.style.cssText = 'margin-top:12px;font-size:12px;color:#6b7280;word-break:break-all;';
                content.appendChild(urlText);
            } else {
                content.innerHTML = `<p style="color:#6b7280;">Preview not available for this file type.</p><a href="${escapeHtml(url)}" target="_blank" rel="noopener noreferrer"><button style="padding:8px 16px;background:#3b82f6;color:#fff;border:none;border-radius:6px;cursor:pointer;margin-top:12px;">Download</button></a>`;
            }

            modal.classList.remove('hidden');
        }

        document.getElementById('modal-close').addEventListener('click', () => {
