server {
    listen 80;
    server_name eee.firebaseit.com www.eee.firebaseit.com;

    # Redirect all HTTP to HTTPS
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name eee.firebaseit.com www.eee.firebaseit.com;

    # SSL — managed by Certbot (run: certbot --nginx -d eee.firebaseit.com)
    ssl_certificate     /etc/letsencrypt/live/eee.firebaseit.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/eee.firebaseit.com/privkey.pem;

    # Proxy to Gunicorn
    location / {
        proxy_pass http://unix:/run/gunicorn_ewportal.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve media uploads directly
    location /media/ {
        alias /var/www/eastwestportal/media/;
    }

    # Serve static files directly (WhiteNoise handles this too, but Nginx is faster)
    location /static/ {
        alias /var/www/eastwestportal/staticfiles/;
    }

    client_max_body_size 20M;
}
